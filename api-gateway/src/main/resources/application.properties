server.port=8080
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/jobmatcher?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
python.resume.service.url=${PYTHON_RESUME_SERVICE_URL:http://localhost:8001}
python.matching.service.url=${PYTHON_MATCHING_SERVICE_URL:http://localhost:8002}
python.blockchain.service.url=${PYTHON_BLOCKCHAIN_SERVICE_URL:http://localhost:8003}
spring.servlet.multipart.max-file-size=10MB
jwt.secret=${JWT_SECRET:uzn1OTnsfcg+zGLvztUpMweHKrOLiXGHxx5tlGGXvEU=}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}