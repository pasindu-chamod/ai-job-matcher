server.port=8080
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/jobmatcher}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=6379
python.resume.service.url=${PYTHON_RESUME_SERVICE_URL:http://localhost:8001}
python.matching.service.url=${PYTHON_MATCHING_SERVICE_URL:http://localhost:8002}
python.blockchain.service.url=${PYTHON_BLOCKCHAIN_SERVICE_URL:http://localhost:8003}
spring.servlet.multipart.max-file-size=10MB